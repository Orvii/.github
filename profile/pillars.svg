<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Orvii pillars: Open, Research, Vision, Innovation &amp; Ideas — connected by one data line">
  <defs>
    <linearGradient id="p-rail" gradientUnits="userSpaceOnUse" x1="70" y1="80" x2="1130" y2="80">
      <stop offset="0%" stop-color="#F05F03"/>
      <stop offset="50%" stop-color="#FEAF12"/>
      <stop offset="100%" stop-color="#F05F03"/>
    </linearGradient>
    <radialGradient id="p-node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEAF12" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FE9106" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .p-flow { animation: p-flow 3.6s linear infinite; }
    .p-node { animation: p-pulse 4s ease-in-out infinite; }
    .p-lab  { animation: p-up .7s cubic-bezier(.16,1,.3,1) both; }
    @keyframes p-flow { to { stroke-dashoffset: -32; } }
    @keyframes p-pulse{ 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @keyframes p-up   { from { opacity:0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) {
      .p-flow,.p-node,.p-lab { animation: none; }
      .p-node { opacity:1; } .p-lab { opacity:1; }
    }
  </style>

  <rect width="1200" height="190" fill="#0b0806"/>
  <line class="p-flow" x1="70" y1="80" x2="1130" y2="80" stroke="url(#p-rail)" stroke-width="2" stroke-dasharray="8 8" opacity="0.8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <g class="p-node" style="animation-delay:0s">
      <circle cx="160" cy="80" r="30" fill="url(#p-node)"/>
      <circle cx="160" cy="80" r="26" fill="#0b0806" stroke="#FE9106" stroke-width="2"/>
      <text x="160" y="90" font-size="26" font-weight="700" fill="#FEAF12">O</text>
      <text class="p-lab" x="160" y="140" font-size="15" letter-spacing="2.2" fill="#b7a496" style="animation-delay:.1s">OPEN</text>
    </g>
    <g class="p-node" style="animation-delay:.35s">
      <circle cx="385" cy="80" r="30" fill="url(#p-node)"/>
      <circle cx="385" cy="80" r="26" fill="#0b0806" stroke="#FE9106" stroke-width="2"/>
      <text x="385" y="90" font-size="26" font-weight="700" fill="#FEAF12">R</text>
      <text class="p-lab" x="385" y="140" font-size="15" letter-spacing="2.2" fill="#b7a496" style="animation-delay:.45s">RESEARCH</text>
    </g>
    <g class="p-node" style="animation-delay:.7s">
      <circle cx="610" cy="80" r="30" fill="url(#p-node)"/>
      <circle cx="610" cy="80" r="26" fill="#0b0806" stroke="#FE9106" stroke-width="2"/>
      <text x="610" y="90" font-size="26" font-weight="700" fill="#FEAF12">V</text>
      <text class="p-lab" x="610" y="140" font-size="15" letter-spacing="2.2" fill="#b7a496" style="animation-delay:.8s">VISION</text>
    </g>
    <g class="p-node" style="animation-delay:1.05s">
      <circle cx="835" cy="80" r="30" fill="url(#p-node)"/>
      <circle cx="835" cy="80" r="26" fill="#0b0806" stroke="#FE9106" stroke-width="2"/>
      <text x="835" y="90" font-size="26" font-weight="700" fill="#FEAF12">I</text>
      <text class="p-lab" x="835" y="140" font-size="15" letter-spacing="2.2" fill="#b7a496" style="animation-delay:1.15s">INNOVATION</text>
    </g>
    <g class="p-node" style="animation-delay:1.4s">
      <circle cx="1060" cy="80" r="30" fill="url(#p-node)"/>
      <circle cx="1060" cy="80" r="26" fill="#0b0806" stroke="#FE9106" stroke-width="2"/>
      <text x="1060" y="90" font-size="26" font-weight="700" fill="#FEAF12">I</text>
      <text class="p-lab" x="1060" y="140" font-size="15" letter-spacing="2.2" fill="#b7a496" style="animation-delay:1.5s">IDEAS</text>
    </g>
  </g>
  <text x="600" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="3.2" fill="#5c4c3f">FIVE LETTERS  ·  ONE FEEDBACK LOOP</text>
</svg>
