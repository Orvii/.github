<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="The Orvii research set: six public repos connected by shared methodology">
  <style>
    .edge { animation: flow 3s linear infinite; }
    .node { animation: pulse 4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .edge, .node { animation: none; } }
  </style>

  <rect width="1200" height="300" fill="#0b0806"/>
  <text x="60" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#8a7a6a">THE RESEARCH SET</text>

  <!-- edges: shared methodology flows -->
  <g class="edge" stroke="#5c4c3f" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <path d="M250 130 C 350 90, 450 90, 550 130"/>
    <path d="M250 170 C 350 210, 450 210, 550 170"/>
    <path d="M650 130 C 750 90, 850 90, 950 130"/>
    <path d="M650 170 C 750 210, 850 210, 950 170"/>
    <path d="M600 190 L 600 240"/>
  </g>

  <!-- nodes -->
  <g font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
    <g class="node">
      <rect x="90" y="120" width="160" height="60" rx="8" fill="#140d08" stroke="#FE9106"/>
      <text x="170" y="146" font-size="15" fill="#F8F5F2">harness-atlas</text>
      <text x="170" y="166" font-size="11" fill="#b7a496">capability evidence</text>
    </g>
    <g class="node" style="animation-delay:.5s">
      <rect x="490" y="120" width="160" height="60" rx="8" fill="#140d08" stroke="#FE9106"/>
      <text x="570" y="146" font-size="15" fill="#F8F5F2">bench-notes</text>
      <text x="570" y="166" font-size="11" fill="#b7a496">measurement method</text>
    </g>
    <g class="node" style="animation-delay:1s">
      <rect x="890" y="120" width="180" height="60" rx="8" fill="#140d08" stroke="#FE9106"/>
      <text x="980" y="146" font-size="15" fill="#F8F5F2">provider-reliability</text>
      <text x="980" y="166" font-size="11" fill="#b7a496">wire-level method</text>
    </g>
    <g class="node" style="animation-delay:1.5s">
      <rect x="290" y="230" width="180" height="60" rx="8" fill="#140d08" stroke="#FEAF12"/>
      <text x="380" y="256" font-size="15" fill="#F8F5F2">equivalence-notes</text>
      <text x="380" y="276" font-size="11" fill="#b7a496">same-behavior proofs</text>
    </g>
    <g class="node" style="animation-delay:2s">
      <rect x="520" y="230" width="160" height="60" rx="8" fill="#140d08" stroke="#FEAF12"/>
      <text x="600" y="256" font-size="15" fill="#F8F5F2">retractions</text>
      <text x="600" y="276" font-size="11" fill="#b7a496">corrections ledger</text>
    </g>
    <g class="node" style="animation-delay:2.5s">
      <rect x="730" y="230" width="170" height="60" rx="8" fill="#140d08" stroke="#FEAF12"/>
      <text x="815" y="256" font-size="15" fill="#F8F5F2">svg-instruments</text>
      <text x="815" y="276" font-size="11" fill="#b7a496">how we publish it</text>
    </g>
  </g>

  <text x="60" y="288" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6e5c50">edges = shared methodology · every claim in every node cites a fetched source</text>
</svg>
