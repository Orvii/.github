<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="The Orvii research set: nine public repos connected by shared methodology">
  <title>The Orvii research set — nine public repos, one evidence contract</title>
  <style>
    .edge { animation: flow 3s linear infinite; }
    .node { animation: pulse 4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .edge, .node { animation: none; } }
  </style>

  <rect width="1200" height="420" fill="#0b0806"/>
  <text x="60" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#8a7a6a">THE RESEARCH SET</text>

  <!-- edges: shared methodology flows (row chains + vertical lattice ties) -->
  <g class="edge" stroke="#5c4c3f" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <!-- row chains -->
    <path d="M380 118 L440 118"/>
    <path d="M760 118 L820 118"/>
    <path d="M380 238 L440 238"/>
    <path d="M760 238 L820 238"/>
    <path d="M380 358 L440 358"/>
    <path d="M760 358 L820 358"/>
    <!-- vertical ties between rows, at node centers -->
    <path d="M220 146 L220 210"/>
    <path d="M600 146 L600 210"/>
    <path d="M980 146 L980 210"/>
    <path d="M220 266 L220 330"/>
    <path d="M600 266 L600 330"/>
    <path d="M980 266 L980 330"/>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" text-anchor="middle">
    <!-- row 1: evidence grids -->
    <g class="node">
      <rect x="60" y="90" width="320" height="56" rx="8" fill="#140d08" stroke="#FE9106"/>
      <text x="220" y="114" font-size="14" fill="#F8F5F2">harness-atlas</text>
      <text x="220" y="132" font-size="10.5" fill="#b7a496">capability evidence, 30 harnesses</text>
    </g>
    <g class="node" style="animation-delay:.4s">
      <rect x="440" y="90" width="320" height="56" rx="8" fill="#140d08" stroke="#FE9106"/>
      <text x="600" y="114" font-size="14" fill="#F8F5F2">context-file-evidence</text>
      <text x="600" y="132" font-size="10.5" fill="#b7a496">does the context file help?</text>
    </g>
    <g class="node" style="animation-delay:.8s">
      <rect x="820" y="90" width="320" height="56" rx="8" fill="#140d08" stroke="#FE9106"/>
      <text x="980" y="114" font-size="14" fill="#F8F5F2">ts-lto-research</text>
      <text x="980" y="132" font-size="10.5" fill="#b7a496">prior art and the gap</text>
    </g>

    <!-- row 2: surfaces and measurement -->
    <g class="node" style="animation-delay:1.2s">
      <rect x="60" y="210" width="320" height="56" rx="8" fill="#140d08" stroke="#FE9106"/>
      <text x="220" y="234" font-size="14" fill="#F8F5F2">convention-map</text>
      <text x="220" y="252" font-size="10.5" fill="#b7a496">interop surface, 22 harnesses</text>
    </g>
    <g class="node" style="animation-delay:1.6s">
      <rect x="440" y="210" width="320" height="56" rx="8" fill="#140d08" stroke="#FE9106"/>
      <text x="600" y="234" font-size="14" fill="#F8F5F2">provider-reliability</text>
      <text x="600" y="252" font-size="10.5" fill="#b7a496">wire-level method</text>
    </g>
    <g class="node" style="animation-delay:2s">
      <rect x="820" y="210" width="320" height="56" rx="8" fill="#140d08" stroke="#FE9106"/>
      <text x="980" y="234" font-size="14" fill="#F8F5F2">bench-notes</text>
      <text x="980" y="252" font-size="10.5" fill="#b7a496">measurement method</text>
    </g>

    <!-- row 3: proof, correction, presentation -->
    <g class="node" style="animation-delay:2.4s">
      <rect x="60" y="330" width="320" height="56" rx="8" fill="#140d08" stroke="#FEAF12"/>
      <text x="220" y="354" font-size="14" fill="#F8F5F2">equivalence-notes</text>
      <text x="220" y="372" font-size="10.5" fill="#b7a496">same-behavior proofs</text>
    </g>
    <g class="node" style="animation-delay:2.8s">
      <rect x="440" y="330" width="320" height="56" rx="8" fill="#140d08" stroke="#FEAF12"/>
      <text x="600" y="354" font-size="14" fill="#F8F5F2">retractions</text>
      <text x="600" y="372" font-size="10.5" fill="#b7a496">corrections ledger</text>
    </g>
    <g class="node" style="animation-delay:3.2s">
      <rect x="820" y="330" width="320" height="56" rx="8" fill="#140d08" stroke="#FEAF12"/>
      <text x="980" y="354" font-size="14" fill="#F8F5F2">svg-instruments</text>
      <text x="980" y="372" font-size="10.5" fill="#b7a496">how we publish it</text>
    </g>
  </g>

  <text x="60" y="414" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6e5c50">edges = shared methodology · every claim in every node cites a fetched source</text>
</svg>
