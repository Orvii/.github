<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 232" width="820" height="232" role="img" aria-label="Terminal: hypothesize, instrument, measure, publish — the Orvii research loop">
  <style>
    .t1 { animation: o-type .7s steps(12) .5s both; }
    .t2 { animation: o-type .9s steps(16) 1.6s both; }
    .t3 { animation: o-type .7s steps(12) 2.9s both; }
    .t4 { animation: o-type .9s steps(14) 4.0s both; }
    .c1 { opacity:0; animation: o-blink 1s steps(1) .5s 1; }
    .c2 { opacity:0; animation: o-blink 1s steps(1) 1.6s 1; }
    .c3 { opacity:0; animation: o-blink 1s steps(1) 2.9s 1; }
    .c4 { opacity:0; animation: o-blink 1s steps(1) 4.0s infinite; }
    .m1 { animation: o-mfade .4s ease-out 1.3s both; }
    .m2 { animation: o-mfade .4s ease-out 2.7s both; }
    .m3 { animation: o-mfade .4s ease-out 3.8s both; }
    .m4 { animation: o-mfade .4s ease-out 5.0s both; }
    @keyframes o-type  { from { clip-path: inset(0 100% 0 0); } }
    @keyframes o-mfade { from { opacity:0; } }
    @keyframes o-blink { 0%,58% { opacity:1; } 58.1%,100% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) {
      .t1,.t2,.t3,.t4,.c1,.c2,.c3,.c4,.m1,.m2,.m3,.m4 { animation: none; }
      .c1,.c2,.c3,.c4 { opacity:0; }
    }
  </style>

  <!-- window -->
  <rect width="820" height="232" rx="11" fill="#0b0806"/>
  <rect width="820" height="36" rx="11" fill="#171009"/>
  <rect y="26" width="820" height="10" fill="#171009"/>
  <rect x="0.5" y="0.5" width="819" height="231" rx="11" fill="none" stroke="#241a10"/>
  <circle cx="24" cy="18" r="5.5" fill="#FE9106"/>
  <circle cx="44" cy="18" r="5.5" fill="#3a2c1e"/>
  <circle cx="64" cy="18" r="5.5" fill="#3a2c1e"/>
  <text x="410" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.8" fill="#6e5c50">orvii@fieldstation — ~/research</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="26" y="76" fill="#F05F03">❯</text>
    <text class="t1" x="48" y="76" fill="#F8F5F2">hypothesize</text>
    <rect class="c1" x="158" y="60" width="9" height="20" fill="#FEAF12"/>
    <text class="m1" x="470" y="76" fill="#5c4c3f"># start from a real question</text>

    <text x="26" y="112" fill="#F05F03">❯</text>
    <text class="t2" x="48" y="112" fill="#F8F5F2">instrument + measure</text>
    <rect class="c2" x="248" y="96" width="9" height="20" fill="#FEAF12"/>
    <text class="m2" x="470" y="112" fill="#5c4c3f"># numbers, not adjectives</text>

    <text x="26" y="148" fill="#F05F03">❯</text>
    <text class="t3" x="48" y="148" fill="#F8F5F2">make it public</text>
    <rect class="c3" x="184" y="132" width="9" height="20" fill="#FEAF12"/>
    <text class="m3" x="470" y="148" fill="#5c4c3f"># open by default</text>

    <text x="26" y="184" fill="#F05F03">❯</text>
    <text class="t4" x="48" y="184" fill="#F8F5F2">write it down</text>
    <rect class="c4" x="184" y="168" width="9" height="20" fill="#FEAF12"/>
    <text class="m4" x="470" y="184" fill="#5c4c3f"># the finding is the artifact</text>

    <text class="m4" x="48" y="214" fill="#3a2c1e">└─ repeat, forever</text>
  </g>
</svg>
