<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Orvii — Open, Research, Vision, Innovation and Ideas — an independent two-person research collective">
  <defs>
    <pattern id="o-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1e1409" stroke-width="1"/>
    </pattern>
    <radialGradient id="o-halo" cx="76%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#FE9106" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#FE9106" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FE9106" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o-coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEAF12" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FE9106" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="o-ringgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEAF12"/>
      <stop offset="55%" stop-color="#FE9106"/>
      <stop offset="100%" stop-color="#F05F03"/>
    </linearGradient>
    <linearGradient id="o-leafgrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FE7007"/>
      <stop offset="100%" stop-color="#FEAF12"/>
    </linearGradient>
    <linearGradient id="o-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FE9106" stop-opacity="0"/>
      <stop offset="80%" stop-color="#FE9106" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FEAF12" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="o-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FE9106"/>
      <stop offset="100%" stop-color="#F05F03"/>
    </linearGradient>
  </defs>

  <style>
    .o-draw  { stroke-dasharray: 1; stroke-dashoffset: 1; animation: o-drawline .9s cubic-bezier(.4,0,.2,1) forwards; }
    .o-dot   { opacity: 0; animation: o-pop .5s cubic-bezier(.16,1,.3,1) 1.3s forwards; }
    .o-fade  { animation: o-fade 1s ease-out both; }
    .o-tag   { animation: o-fade .8s ease-out 1.1s both; }
    .o-rule  { animation: o-grow 1.2s ease-out .2s both; }
    .o-ring  { transform-origin: 908px 200px; animation: o-spin 26s linear infinite; }
    .o-ring2 { transform-origin: 908px 200px; animation: o-spin 42s linear infinite reverse; }
    .o-arm   { transform-origin: 908px 200px; animation: o-spin 7s linear infinite; }
    .o-glow  { transform-origin: 908px 200px; animation: o-breathe 3.6s ease-in-out infinite; }
    .o-pip   { animation: o-pulse 2.6s ease-in-out infinite; }
    .o-caret { animation: o-blink 1.15s steps(1) infinite; }
    @keyframes o-drawline { to { stroke-dashoffset: 0; } }
    @keyframes o-pop   { from { opacity:0; transform: scale(.4); } to { opacity:1; transform: scale(1); } }
    @keyframes o-fade  { from { opacity: 0; } }
    @keyframes o-grow  { from { opacity: 0; transform: scaleX(0); } }
    @keyframes o-spin  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes o-breathe { 0%,100% { opacity:.5; transform: scale(.92); } 50% { opacity:1; transform: scale(1.05); } }
    @keyframes o-pulse { 0%,100% { opacity:.25; } 50% { opacity:1; } }
    @keyframes o-blink { 0%,58% { opacity:1; } 58.1%,100% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) {
      .o-draw,.o-dot,.o-fade,.o-tag,.o-rule,.o-ring,.o-ring2,.o-arm,.o-glow,.o-pip,.o-caret { animation: none !important; }
      .o-draw { stroke-dashoffset: 0; } .o-dot,.o-tag,.o-fade { opacity: 1; }
    }
  </style>

  <!-- panel -->
  <rect width="1200" height="420" fill="#0b0806"/>
  <rect width="1200" height="420" fill="url(#o-grid)"/>
  <rect width="1200" height="420" fill="url(#o-halo)"/>

  <!-- corner brackets -->
  <g stroke="#3a2c1e" stroke-width="2" fill="none">
    <path d="M26 54V26h28"/><path d="M1146 26h28v28"/>
    <path d="M1174 366v28h-28"/><path d="M54 394H26v-28"/>
  </g>

  <!-- top datasheet label -->
  <text class="o-fade" x="56" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="4.6" fill="#8a7563">ORVII COLLECTIVE  //  ORG.DATASHEET</text>
  <text class="o-fade" x="1144" y="54" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.4" fill="#5c4c3f">TÜRKİYE · REV 2026-10</text>
  <rect class="o-rule" x="56" y="66" width="132" height="3" fill="url(#o-edge)" style="transform-origin:56px 66px"/>

  <!-- hand-drawn wordmark: Orvii (rounded geometric strokes, font-independent) -->
  <g fill="none" stroke="#F8F5F2" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <circle class="o-draw" cx="118" cy="160" r="50" pathLength="1" style="animation-delay:.15s"/>
    <path class="o-draw" d="M214 222 V124" pathLength="1" style="animation-delay:.45s"/>
    <path class="o-draw" d="M214 156 C214 130 230 124 246 124" pathLength="1" style="animation-delay:.6s"/>
    <path class="o-draw" d="M272 124 L300 222 L328 124" pathLength="1" style="animation-delay:.75s"/>
    <path class="o-draw" d="M362 222 V124" pathLength="1" style="animation-delay:.95s"/>
    <path class="o-draw" d="M404 222 V124" pathLength="1" style="animation-delay:1.05s"/>
  </g>
  <circle class="o-dot" cx="362" cy="92" r="13" fill="#FE9106" style="transform-origin:362px 92px"/>
  <circle class="o-dot" cx="404" cy="92" r="13" fill="#FE7007" style="transform-origin:404px 92px;animation-delay:1.45s"/>

  <!-- acronym expansion -->
  <text class="o-tag" x="56" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="3.2" fill="#FEAF12">OPEN · RESEARCH · VISION · INNOVATION · IDEAS</text>

  <!-- one-liner -->
  <text class="o-tag" x="56" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16.5" letter-spacing="0.4" fill="#b7a496">Building useful, experimental and open-source software</text>
  <text class="o-tag" x="56" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16.5" letter-spacing="0.4" fill="#b7a496">together — in public, with receipts.</text>

  <!-- bottom readout -->
  <rect class="o-rule" x="56" y="360" width="1088" height="1" fill="#241a10" style="transform-origin:56px 360px;animation-delay:.5s"/>
  <text class="o-tag" x="56" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" letter-spacing="1.6" fill="#6e5c50">OPEN BY DEFAULT  ·  EVIDENCE OVER HYPE  ·  SHIP SMALL, PROVE IT</text>
  <text class="o-tag" x="1144" y="390" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" letter-spacing="1.6" fill="#6e5c50">SCOPE <tspan class="o-caret" fill="#FEAF12">▮</tspan> LOCKED</text>

  <!-- emblem: the Orvii "o" + leaf, inside a slow orbital scope -->
  <g>
    <circle cx="908" cy="200" r="124" fill="none" stroke="#241a10" stroke-width="1"/>
    <circle cx="908" cy="200" r="96" fill="none" stroke="#1e1409" stroke-width="1"/>
    <g stroke="#3a2c1e" stroke-width="1.6">
      <line x1="908" y1="62" x2="908" y2="76"/><line x1="908" y1="324" x2="908" y2="338"/>
      <line x1="770" y1="200" x2="784" y2="200"/><line x1="1032" y1="200" x2="1046" y2="200"/>
    </g>

    <circle class="o-ring"  cx="908" cy="200" r="112" fill="none" stroke="#F05F03" stroke-width="1.6" stroke-dasharray="3 13" opacity="0.8"/>
    <circle class="o-ring2" cx="908" cy="200" r="86"  fill="none" stroke="#FE7007" stroke-width="1.3" stroke-dasharray="18 12" opacity="0.55"/>

    <g class="o-arm">
      <path d="M908 200 L908 88 A112 112 0 0 1 998 246 Z" fill="url(#o-sweep)" opacity="0.4"/>
      <line x1="908" y1="200" x2="908" y2="88" stroke="#FEAF12" stroke-width="1.3" opacity="0.7"/>
    </g>

    <circle class="o-pip" cx="908" cy="76"  r="4.5" fill="#FEAF12" style="animation-delay:0s"/>
    <circle class="o-pip" cx="1020" cy="200" r="4" fill="#FE9106" style="animation-delay:.8s"/>
    <circle class="o-pip" cx="830" cy="262" r="3.5" fill="#FEAF12" style="animation-delay:1.6s"/>

    <!-- the logo "o": gradient ring + inner swoosh -->
    <circle class="o-glow" cx="908" cy="200" r="76" fill="url(#o-coreglow)"/>
    <circle cx="908" cy="200" r="52" fill="none" stroke="url(#o-ringgrad)" stroke-width="26" stroke-linecap="round"/>
    <path d="M878 238 Q922 246 944 212" fill="none" stroke="url(#o-ringgrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- leaf -->
    <path d="M950 128 Q976 92 1014 90 Q996 128 954 134 Z" fill="url(#o-leafgrad)"/>
  </g>
</svg>
